name: course_ledger
description: "Course Ledger — the book of everywhere you've played. A private, on-device golf courses-played ledger. © Code Cowboys LLC."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Matches cc_core's floor — all CC apps build with the same local SDK
  # (~/sdks/flutter 3.44.9, in step with Codemagic).
  sdk: ^3.12.2

dependencies:
  cc_core:
    git:
      url: https://github.com/Mark-Code-Cowboys/cc_core.git
      ref: v0.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # CSV pick for the import mapper (SAF/native dialogs, no permissions).
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  # Multi-select fallback for scorecard capture where the ML Kit
  # document scanner isn't available (iOS).
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  stream_transform: ^2.1.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
